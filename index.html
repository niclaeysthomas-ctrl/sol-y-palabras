<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apprendre l'espagnol en douceur : séance du jour, flashcards, exercices, grammaire, dialogues et test de niveau.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='24' fill='%23F2A81D'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1F4FA8">
<title>Sol y Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: azulejo-tiled header band with a sun, then a single focused column; the card in play is the hero. */
:root{
  --bg:#FBF8F1;            /* whitewashed wall */
  --surface:#FFFFFF;
  --ink:#1B2440;           /* deep cobalt ink */
  --muted:#5E6785;
  --line:#E3DDCC;
  --cobalt:#1F4FA8;        /* azulejo blue */
  --cobalt-soft:#E6EDFA;
  --saffron:#F2A81D;       /* sun */
  --saffron-soft:#FDF0D3;
  --ok:#2E8B57; --ok-soft:#E3F3EA;
  --bad:#C0392B; --bad-soft:#FBE7E4;
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A;--surface:#182040;--ink:#F2EEE3;--muted:#A6AEC8;--line:#2A3459;
  --cobalt:#7FA4F0;--cobalt-soft:#1F2C55;--saffron:#F5B83D;--saffron-soft:#3A3020;
  --ok:#5CC48A;--ok-soft:#173828;--bad:#F07B6E;--bad-soft:#3F1F1F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A;--surface:#182040;--ink:#F2EEE3;--muted:#A6AEC8;--line:#2A3459;
  --cobalt:#7FA4F0;--cobalt-soft:#1F2C55;--saffron:#F5B83D;--saffron-soft:#3A3020;
  --ok:#5CC48A;--ok-soft:#173828;--bad:#F07B6E;--bad-soft:#3F1F1F;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Header band */
.band{position:relative;overflow:hidden;background:var(--cobalt);color:#fff;padding-block:28px 0}
.tiles{position:absolute;inset:0;opacity:.16;background-image:
  radial-gradient(circle at 50% 50%, transparent 9px, #fff 10px, #fff 12px, transparent 13px),
  linear-gradient(45deg, transparent 46%, #fff 47%, #fff 53%, transparent 54%),
  linear-gradient(-45deg, transparent 46%, #fff 47%, #fff 53%, transparent 54%);
  background-size:48px 48px}
.band-in{position:relative;max-width:880px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sun{width:74px;height:74px;flex:none}
.sun circle{fill:var(--saffron)} .sun path{stroke:var(--saffron)}
@media (prefers-reduced-motion:no-preference){.sun g{animation:spin 60s linear infinite;transform-origin:50px 50px}}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:2.3rem;margin:0;line-height:1.05;letter-spacing:.01em}
.brand p{margin:4px 0 0;opacity:.88;font-size:1rem}
.streak{margin-left:auto;text-align:right;font-size:.95rem}
.streak b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1;color:var(--saffron)}
nav{position:relative;max-width:880px;margin:22px auto 0;padding-inline:20px;display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.82;padding:12px 18px;border-radius:12px 12px 0 0;font-weight:600;font-size:1rem}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0 0 6px;text-wrap:balance}
h3{font-size:1.15rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt);font-weight:700}

/* Today */
.today{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:720px){.today{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.hero-panel{background:var(--saffron-soft);border-color:transparent}
.plan{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:10px}
.plan li{display:flex;align-items:center;gap:12px;font-weight:500}
.plan .n{font-variant-numeric:tabular-nums;min-width:2.2em;height:2.2em;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--cobalt)}
.plan li.done{color:var(--muted);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.9rem;color:var(--muted)}
.week{display:flex;gap:6px;margin-top:18px}
.week div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.week i{display:block;height:28px;border-radius:6px;background:var(--line);margin-bottom:4px}
.week i.on{background:var(--saffron)}
.tip{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px}
.tip .es{font-family:var(--f-display);font-size:1.3rem}

.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;background:var(--cobalt);color:#fff;font-size:1.02rem}
.btn:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn{color:#10162A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10162A}}
.btn.sun-btn{background:var(--saffron);color:#1B2440}
.btn.ghost{background:transparent;color:var(--cobalt);border:2px solid var(--cobalt)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.deck{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink)}
.deck:hover{border-color:var(--cobalt)}
.deck .t{font-weight:700;font-size:1.05rem}
.deck .m{font-size:.88rem;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron)}
.due{display:inline-block;font-size:.78rem;font-weight:700;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:2px 9px;margin-top:8px}

/* Flashcard */
.stage{max-width:620px;margin:0 auto}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 28px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;box-shadow:0 10px 30px -18px rgba(27,36,64,.35)}
.card .side{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .word{font-family:var(--f-display);font-size:2.4rem;line-height:1.15;text-wrap:balance}
.card .ans{font-family:var(--f-display);font-size:2rem;color:var(--cobalt)}
.card .ex{color:var(--muted);font-style:italic;font-size:1rem}
.say{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media (max-width:520px){.grades{grid-template-columns:repeat(2,1fr)}}
.grades button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px;font-weight:700}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.grades .g0{border-color:var(--bad)} .grades .g3{border-color:var(--ok)}
.keys{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:var(--f-body);font-size:.8rem;background:var(--surface)}

/* Grammar */
.lessons{display:grid;gap:10px}
.lesson-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:var(--ink)}
.lesson-btn:hover{border-color:var(--cobalt)}
.lesson-btn .lvl{font-size:.8rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.todo{background:var(--saffron-soft);color:#8A5A00}
:root[data-theme="dark"] .chip.todo{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.todo{color:var(--saffron)}}
.lesson-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:70ch}
.lesson-body p{margin:0 0 12px}
.tbl-wrap{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;min-width:300px}
th,td{text-align:left;padding:7px 16px 7px 0;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.es{font-weight:700;color:var(--cobalt)}
.note{background:var(--cobalt-soft);border-radius:10px;padding:12px 16px;margin:12px 0}

/* Quiz & translation */
.q{font-size:1.35rem;font-weight:600;margin:0 0 16px;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:1.05rem}
.choice:hover:not(:disabled){border-color:var(--cobalt)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;padding:12px 16px;border-radius:10px}
.feedback.ok{background:var(--ok-soft)} .feedback.ko{background:var(--bad-soft)}
.fr{font-family:var(--f-display);font-size:1.7rem;line-height:1.25;margin:4px 0 18px;text-wrap:balance}
input[type=text]{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=text]:focus{border-color:var(--cobalt);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.accents button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:40px;padding:6px 10px;font-size:1.05rem}
.hint{color:var(--muted);font-size:.92rem}
.done-box{text-align:center;padding:30px 10px}
.done-box .big{font-family:var(--f-display);font-size:2.6rem;color:var(--cobalt)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.92rem}
.filter button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.back{background:none;border:0;color:var(--cobalt);font-weight:700;padding:0;margin-bottom:14px}
footer{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 30px;color:var(--muted);font-size:.85rem}

body{font-size:18px}
nav button{padding:12px 15px}
@media (max-width:640px){nav button{padding:10px 10px;font-size:.92rem}}
.lvl-badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--cobalt-soft);color:var(--cobalt)}
.lvl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.lvl-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.lvl-head .hint{font-size:.9rem}
.rec{font-size:.75rem;font-weight:700;color:#8A5A00;background:var(--saffron-soft);border-radius:999px;padding:2px 9px}
:root[data-theme="dark"] .rec{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rec{color:var(--saffron)}}
.welcome{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--cobalt);color:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:20px}
.welcome h2{color:#fff}
.welcome p{margin:0 0 14px;opacity:.92;max-width:58ch}
.welcome .big-sun{width:70px;height:70px}
.welcome .big-sun circle{fill:var(--saffron)}
.welcome .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
:root[data-theme="dark"] .welcome{background:var(--cobalt-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .welcome{background:var(--cobalt-soft)}}
@media (max-width:560px){.welcome{grid-template-columns:1fr}.welcome .big-sun{display:none}}
.idk{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:12px;padding:4px 0;font-size:.95rem}
.result-level{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--cobalt)}
.skills{display:grid;gap:12px;margin:18px 0}
.skill{display:grid;grid-template-columns:140px 1fr 56px;gap:12px;align-items:center;font-size:.95rem}
@media (max-width:480px){.skill{grid-template-columns:100px 1fr 48px}}
.skill .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.skill .track i{display:block;height:100%;background:var(--cobalt);border-radius:6px}
.skill b{text-align:right;font-variant-numeric:tabular-nums}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.ladder div{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.ladder div b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--ink)}
.ladder div.here{border-color:var(--saffron);background:var(--saffron-soft);color:var(--ink)}
.ladder div.ok b{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
textarea{width:100%;min-height:90px;font:inherit;font-size:.85rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;word-break:break-all}
textarea:focus{border-color:var(--cobalt);outline:none}
.msg{margin-top:10px;font-size:.95rem}
.msg.ok{color:var(--ok)} .msg.ko{color:var(--bad)}
/* dialogues */
.bubbles{display:grid;gap:12px;margin:16px 0 22px}
.bubble{max-width:82%;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 16px;justify-self:start}
.bubble.me{justify-self:end;background:var(--cobalt-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble .who{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.bubble .es{font-size:1.12rem;margin-top:2px}
.bubble .tr{color:var(--muted);font-style:italic;font-size:.95rem;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.82rem}
.bubble .mini{flex:none}
.listen-card{text-align:center}
.listen-big{width:110px;height:110px;border-radius:50%;border:0;background:var(--saffron);color:#1B2440;font-size:2.6rem;margin:6px auto 12px;display:grid;place-items:center;box-shadow:0 10px 26px -14px rgba(242,168,29,.9)}
.listen-big:hover{filter:brightness(1.05)}
.shown-word{font-family:var(--f-display);font-size:1.6rem;color:var(--cobalt);min-height:1.6em}
.note.warn{background:var(--saffron-soft);margin:0 0 18px}
.linkish{background:none;border:0;padding:0;color:var(--cobalt);font-weight:700;text-decoration:underline;font-size:inherit}
.example{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.ex-es{font-size:1.15rem;font-style:italic}
.ex-fr{color:var(--muted);font-size:.95rem;margin-top:2px}
.ex-line{margin-top:8px;font-style:italic}
.q.cloze{font-size:1.45rem;line-height:1.5}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--saffron);color:var(--muted);text-align:center;padding:0 4px}
.gap.filled{color:var(--cobalt);font-weight:700;border-color:var(--cobalt)}
.order-ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.order-bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:1.1rem;font-weight:600}
.tok:hover:not(:disabled){border-color:var(--cobalt)}
.tok.on{background:var(--cobalt-soft);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.conj-q{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.conj-q .pron{font-family:var(--f-display);font-size:2rem;color:var(--cobalt)}
.conj-q .verb{font-family:var(--f-display);font-size:2rem}
table.conj{min-width:240px;margin-top:4px}
table.conj th{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink)}
table.conj tr.hl td{background:var(--saffron-soft)}
.conj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px;margin-top:16px}
.sel{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;margin-top:4px}
.voice-row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.voice-row>div{display:flex;flex-direction:column;min-width:0}
.voice-row input[type=range]{width:200px;max-width:100%;accent-color:var(--cobalt);margin-top:10px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:700;color:var(--cobalt)}
.help{margin:10px 0 0;padding-left:20px;display:grid;gap:8px;max-width:75ch}
.wordlist{display:grid;border-top:1px solid var(--line)}
.wl-row{display:grid;grid-template-columns:minmax(150px,1fr) 2fr auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.wl-row>div{min-width:0}
.wl-ex{font-style:italic}
.wl-ex .hint{font-style:normal}
@media (max-width:640px){.wl-row{grid-template-columns:1fr auto}.wl-ex{grid-column:1/-1;grid-row:2}}
.deck{display:flex;flex-direction:column}
.deck .due{margin:0;padding:1px 8px}
.deck-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn.small{padding:8px 16px;font-size:.92rem}
.chip.seen{background:var(--cobalt-soft);color:var(--cobalt)}
.train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.panel.train{display:flex;flex-direction:column;gap:6px}
.panel.train h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0}
.panel.train p{margin:0 0 10px;flex:1}
.panel.train .btn{align-self:flex-start}
.panel.train.wide{grid-column:1/-1}
.err-panel{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;background:var(--saffron-soft);border-color:transparent}
.err-panel h3{display:flex;align-items:center;gap:10px}
.filter button[aria-pressed="true"] .hint{color:inherit;opacity:.8}
</style>
</head>
<body>
<header class="band">
  <div class="tiles" aria-hidden="true"></div>

 {id:"questions",lvl:1,t:"Poser des questions",sub:"Les mots interrogatifs",html:`

 {id:"perfecto",lvl:2,t:"Le passé composé",sub:"He comido, hemos visitado",html:`

 <div class="note"><b>Irréguliers fréquents :</b> hecho (fait), visto (vu), dicho (dit), escrito (écrit), vuelto (revenu), puesto (mis).<br>En Espagne, on l'utilise pour ce qui s'est passé aujourd'hui ou récemment : <i>Hoy he comido paella.</i></div>`,

 {id:"porpara",lvl:3,t:"Por ou para ?",sub:"Deux façons de dire « pour »",html:`

const KEY="solypalabras-v1";
const LVL={1:"A1",2:"A2",3:"B1"};
const LVLNAME={1:"Bases",2:"Intermédiaire",3:"Avancé"};
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>fmt(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return fmt(d)};
const blank=()=>({cards:{},lessons:{},dialogues:{},mistakes:{},days:[],session:null,level:null,placement:null,skipTest:false,sessLen:"normal",voiceName:null,rate:0.9});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
if(!S.mistakes||typeof S.mistakes!=="object")S.mistakes={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const myLevel=()=>S.level||1;

const allCards=[];for(const k in DECKS)DECKS[k].w.forEach((w,i)=>allCards.push({id:k+":"+i,deck:k,lvl:DECKS[k].lvl,es:w[0],fr:w[1],ex:w[2]||"",exFr:w[3]||""}));
const CARD={};allCards.forEach(c=>CARD[c.id]=c);
const cardById=id=>CARD[id];
const isDue=c=>{const s=S.cards[c.id];return !!s&&s.due<=todayStr()};
const isNew=c=>!S.cards[c.id];
const isLearned=c=>{const s=S.cards[c.id];return !!s&&s.reps>=2};

function grade(id,g){ // 0 à revoir, 1 difficile, 2 bien, 3 facile
  const s=S.cards[id]||{iv:0,ease:2.5,reps:0};
  if(g===0){s.iv=0;s.reps=0;s.ease=Math.max(1.3,s.ease-.2)}
  else{
    if(s.reps===0)s.iv=g===3?3:1; else if(s.reps===1)s.iv=g===1?2:(g===3?7:4);
    else s.iv=Math.round(s.iv*(g===1?1.2:g===3?s.ease*1.3:s.ease));
    s.ease=Math.max(1.3,s.ease+(g===1?-.15:g===3?.1:0));s.reps++;
  }
  s.due=addDays(todayStr(),s.iv);S.cards[id]=s;markDay();save();
}
function markDay(){const t=todayStr();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-120)}}
function streak(){let n=0,d=todayStr();if(!S.days.includes(d))d=addDays(d,-1);while(S.days.includes(d)){n++;d=addDays(d,-1)}return n}

  if(/google/.test(n))s+=5;
  if(/m[oó]nica|jorge|elvira|[aá]lvaro|paulina|lucía|lucia|marisol|helena|laura|pablo/.test(n))s+=2;
  if(v.localService===false)s+=1;
  return s;
}
function loadVoices(){
  if(!canSpeak)return;
  try{allVoices=speechSynthesis.getVoices()||[]}catch(e){allVoices=[]}
  esVoices=allVoices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("es")).sort((a,b)=>rankVoice(b)-rankVoice(a));
  if(allVoices.length)voicesLoaded=true;
  esVoice=(S.voiceName&&esVoices.find(v=>v.name===S.voiceName))||esVoices[0]||null;
}
const noSpanishVoice=()=>canSpeak&&voicesLoaded&&esVoices.length===0;
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{const before=esVoices.length;loadVoices();if(before!==esVoices.length&&!view&&(tab==="today"||tab==="level"))render()}}catch(e){}}
function speak(t,queue){
  if(!canSpeak||!t)return;

}

/* ================= OUTILS ================= */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:'"«»—…()]/g,"").replace(/\s+/g," ").trim();
const soft=s=>String(s).toLowerCase().replace(/[¿?¡!.,;:'"«»—…()]/g,"").replace(/\s+/g," ").trim(); // garde les accents
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const badge=l=>`<span class="lvl-badge">${LVL[l]}</span>`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const stripEnd=s=>String(s).replace(/…/g,"").replace(/^[¿¡]+/,"").replace(/[?!.]+$/,"").trim();
const ARTS=/^(el|la|los|las|un|una|unos|unas)\s+/i;
const bareOf=s=>stripEnd(s).replace(ARTS,"");
const sayBtn=(id,label)=>canSpeak?`<button class="mini" id="${id}" aria-label="Écouter">🔊${label?" "+label:""}</button>`:"";

function findIn(text,term){
  if(!term)return null;
  const e=term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const m=new RegExp("(^|[^\\p{L}])("+e+")(?![\\p{L}])","iu").exec(text);
  if(!m)return null;const start=m.index+m[1].length;return {start,end:start+m[2].length,text:m[2]};
}
function clozeOf(c){
  if(!c||!c.ex)return null;const full=stripEnd(c.es);if(!full)return null;
  let r=findIn(c.ex,full),bare=false;
  if(!r){const b=bareOf(c.es);if(b&&b!==full){r=findIn(c.ex,b);bare=true}}
  return r?Object.assign(r,{bare}):null;
}
const orderTokens=s=>String(s).replace(/[¿?¡!.,;:«»—]/g," ").split(/\s+/).filter(Boolean);
const orderOk=s=>!!s&&!/[—«]/.test(s)&&orderTokens(s).length>=3&&orderTokens(s).length<=9;

/* ================= ERREURS ================= */
function logResult(key,ok){
  if(key.startsWith("v:"))return;
  if(!ok)S.mistakes[key]=(S.mistakes[key]||0)+1;
  else if(S.mistakes[key]!==undefined)delete S.mistakes[key];
  save();
}
const mistakeKeys=()=>Object.keys(S.mistakes).filter(validKey);
function validKey(k){
  const [t,...r]=k.split(":");const rest=r.join(":");
  if(t==="g"){const[lid,qi]=rest.split(":");const L=LESSONS.find(l=>l.id===lid);return !!(L&&L.q[+qi])}
  if(t==="j"){const[v,te,p]=rest.split("|");return !!(VERBS[v]&&VERBS[v][te]&&VERBS[v][te][+p])}
  if(t==="t"){return rest.startsWith("e:")?!!CARD[rest.slice(2)]:!!PHRASES[+rest]}
  if(t==="o"){return rest.startsWith("c:")?!!CARD[rest.slice(2)]:!!PHRASES[+rest.slice(2)]}
  return !!CARD[rest];
}

/* ================= GÉNÉRATION D'EXERCICES ================= */
function practicePool(L){
  const seen=allCards.filter(c=>!isNew(c));
  if(seen.length>=20)return seen;
  const lv=allCards.filter(c=>c.lvl<=L);
  const ids=new Set(seen.map(c=>c.id));
  return [...seen,...shuffle(lv).filter(c=>!ids.has(c.id))].slice(0,Math.max(40,seen.length));
}
function makeItems(type,n,opt){
  opt=opt||{};const L=myLevel();if(n<=0)return [];
  const pool=practicePool(L);
  switch(type){
    case "listen":return shuffle(pool).slice(0,n).map(c=>"l:"+c.id);
    case "cloze":return shuffle(pool.filter(c=>clozeOf(c))).slice(0,n).map(c=>"z:"+c.id);
    case "write":{const p=allCards.filter(c=>!isNew(c));return shuffle(p.length>=n?p:pool).slice(0,n).map(c=>"w:"+c.id)}
    case "dictee":return shuffle(pool).slice(0,n).map(c=>(L>=2&&orderOk(c.ex)&&Math.random()<.6?"dx:":"dw:")+c.id);
    case "order":{
      const a=pool.filter(c=>orderOk(c.ex)).map(c=>"o:c:"+c.id);
      const b=PHRASES.map((p,i)=>[p,i]).filter(([p])=>p[4]<=L&&orderOk(p[2])).map(([p,i])=>"o:p:"+i);
      return shuffle([...shuffle(a).slice(0,Math.ceil(n*.7)),...shuffle(b).slice(0,n)]).slice(0,n);
    }
    case "gram":{
      let ls=LESSONS.filter(l=>S.lessons[l.id]||l.lvl===L);if(!ls.length)ls=LESSONS.filter(l=>l.lvl<=L);
      return shuffle(ls.flatMap(l=>l.q.map((q,i)=>"g:"+l.id+":"+i))).slice(0,n);
    }
    case "conj":{
      const tenses=opt.tenses&&opt.tenses.length?opt.tenses:Object.keys(TENSES).filter(t=>TENSES[t].lvl<=L);
      const verbs=Object.keys(VERBS),out=new Set();let guard=0;
      while(out.size<n&&guard++<500){
        const t=tenses[Math.floor(Math.random()*tenses.length)],v=verbs[Math.floor(Math.random()*verbs.length)],p=Math.floor(Math.random()*6);
        if(p===4&&Math.random()<.6)continue; // vosotros un peu moins souvent
        out.add("j:"+v+"|"+t+"|"+p);
      }
      return [...out];
    }
    case "trad":{
      const ph=PHRASES.map((p,i)=>[p,i]).filter(([p])=>p[4]<=L).map(([p,i])=>"t:"+i);
      const seen=allCards.filter(c=>!isNew(c)&&c.ex&&c.exFr&&!/[—«]/.test(c.ex)).map(c=>"t:e:"+c.id);
      const nEx=seen.length>=8?Math.floor(n/3):0;
      return shuffle([...shuffle(ph).slice(0,n-nEx),...shuffle(seen).slice(0,nEx)]);
    }
    case "review":return shuffle(mistakeKeys()).slice(0,n);
  }
  return [];
}
const STEP_LABEL={vocab:"Vocabulaire",review:"Revoir mes erreurs",listen:"Écoute",cloze:"Phrases à trous",order:"Remettre dans l'ordre",gram:"Grammaire",conj:"Conjugaison",trad:"Traduction",write:"Écrire les mots",dictee:"Dictée"};

  court:{t:"Courte",d:"≈ 10 min",steps:{vocab:8,review:2,listen:2,cloze:3,order:2,gram:3,conj:3,trad:2}},
  normal:{t:"Normale",d:"≈ 20 min",steps:{vocab:12,review:4,listen:3,cloze:4,order:3,gram:4,conj:5,trad:3,write:3}},
  long:{t:"Longue",d:"≈ 30 min",steps:{vocab:18,review:6,listen:4,cloze:6,order:4,gram:5,conj:8,trad:4,write:5,dictee:4}}
};

/* ================= SÉANCE DU JOUR ================= */
function buildSession(){
  const L=myLevel(),sz=SIZES[S.sessLen]||SIZES.normal,steps=[];
  for(const k in sz.steps){
    const n=sz.steps[k];let items;
    if(k==="vocab"){
      const due=shuffle(allCards.filter(isDue)).slice(0,Math.ceil(n*.7));
      const order=c=>Math.abs(c.lvl-L)+(c.lvl>L?.5:0);
      const fresh=allCards.filter(c=>isNew(c)&&c.lvl<=Math.min(3,L+1)).sort((a,b)=>order(a)-order(b));
      items=[...due,...fresh.slice(0,Math.max(4,n-due.length))].slice(0,n).map(c=>"v:"+c.id);
    } else items=makeItems(k,n);
    if(items.length)steps.push({k,items});
  }
  return {date:todayStr(),len:S.sessLen,steps,step:0,idx:0,score:0,total:0,done:false,v:3};
}
function getSession(){if(!S.session||S.session.date!==todayStr()||S.session.v!==3){S.session=buildSession();save()}return S.session}

/* --- Lanceur générique --- */
function runItem(key,top,done){
  const fin=ok=>{logResult(key,ok);done(ok)};
  const [t,...r]=key.split(":");const rest=r.join(":");
  switch(t){
    case "v":return flashcard(CARD[rest],top,()=>done());
    case "l":return listenItem(CARD[rest],top,fin);
    case "z":return clozeItem(CARD[rest],top,fin);
    case "w":return writeItem(CARD[rest],top,fin);
    case "dw":return dicteeItem(CARD[rest],false,top,fin);
    case "dx":return dicteeItem(CARD[rest],true,top,fin);
    case "o":{const src=rest.startsWith("c:")?{es:CARD[rest.slice(2)].ex,fr:CARD[rest.slice(2)].exFr}:{es:PHRASES[+rest.slice(2)][2],fr:PHRASES[+rest.slice(2)][0]};return orderItem(src,top,fin)}
    case "g":{const[lid,qi]=rest.split(":");const L=LESSONS.find(l=>l.id===lid);return quizItem(L.q[+qi],top,fin,{shuffle:true,eyebrow:"Grammaire · "+L.t})}
    case "j":{const[v,te,p]=rest.split("|");return conjItem(v,te,+p,top,fin)}
    case "t":{if(rest.startsWith("e:")){const c=CARD[rest.slice(2)];return transItem([c.exFr,[c.ex],c.ex],top,fin)}return transItem(PHRASES[+rest],top,fin)}
  }
  done();
}
function runList(keys,o){

      $("bk").onclick=()=>{view=null;render()};const re=$("re");if(re)re.onclick=o.again;$("streakN").textContent=streak();return}

                       :`<div class="side">${fresh?"Nouveau mot · ":""}Espagnol</div><div class="word">${esc(c.es)}</div>`;

    paint(`<div class="stage">${top}
     <div class="card">${(!reverse||shown)&&canSpeak?`<button class="say" id="say" aria-label="Écouter le mot">🔊 Mot</button>`:""}
       ${front}
       ${shown?back+(c.ex?`<div class="example"><div class="ex-es">${esc(c.ex)} ${sayBtn("sayEx")}</div><div class="ex-fr">${esc(c.exFr)}</div></div>`:""):""}
     </div>
     ${shown?`<div class="grades">
        <button class="g0" data-g="0">À revoir<small>demain</small></button>
        <button data-g="1">Difficile<small>bientôt</small></button>
        <button data-g="2">Bien<small>plus tard</small></button>
        <button class="g3" data-g="3">Facile<small>beaucoup plus tard</small></button></div>
        <div class="keys">Raccourcis : <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></div>`
      :`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="flip">Voir la réponse</button></div><div class="keys">ou appuie sur <kbd>Espace</kbd></div>`}
    </div>`);
    const sy=$("say");if(sy)sy.onclick=()=>speak(c.es);
    const se=$("sayEx");if(se)se.onclick=()=>speak(c.ex);
    const fl=$("flip");if(fl)fl.onclick=flip;
    document.querySelectorAll(".grades button").forEach(b=>b.onclick=()=>{grade(c.id,+b.dataset.g);onDone()});
  };

  draw();if(fresh)speak(c.es);
}

function listenItem(c,top,onDone){

  const pool=shuffle(allCards.filter(x=>x.id!==c.id&&x.fr!==c.fr&&Math.abs(x.lvl-c.lvl)<=1)).slice(0,3);
  const opts=shuffle([c,...pool]);
  paint(`<div class="stage">${top}<div class="panel listen-card">

    ${canSpeak?`<button class="listen-big" id="play" aria-label="Réécouter">🔊</button><div class="hint">Clique sur le soleil pour réécouter</div>`:`<p class="hint">La voix n'est pas disponible sur ce navigateur : lis le mot.</p>`}
    <div class="shown-word" id="sw">${canSpeak?"":esc(c.es)}</div>
    <div class="choices" style="text-align:left;margin-top:14px">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o.fr)}</button>`).join("")}</div>
    <div id="fb"></div></div></div>`);
  if(canSpeak){$("play").onclick=()=>speak(c.es);speak(c.es)}
  let answered=false;
  const pick=i=>{if(answered)return;answered=true;const ok=opts[i].id===c.id;
    document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(opts[j].id===c.id)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    $("sw").textContent=c.es;
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}" style="text-align:left"><b>${ok?"¡Muy bien!":"Pas tout à fait."}</b> « ${esc(c.es)} » veut dire « ${esc(c.fr)} ».${c.ex?`<div class="ex-line">${esc(c.ex)} <span class="hint">· ${esc(c.exFr)}</span></div>`:""}</div>`+nextRow();

  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length)pick(n-1)};
}

/* --- Phrase à trous --- */
function clozeItem(c,top,onDone){
  const cz=clozeOf(c);if(!cz){onDone();return}
  const formOf=x=>cz.bare?bareOf(x.es):stripEnd(x.es);
  const answer=cz.text;
  const seenF=new Set([norm(answer)]);
  const cands=shuffle(allCards.filter(x=>x.deck===c.deck&&x.id!==c.id)).concat(shuffle(allCards.filter(x=>x.lvl===c.lvl&&x.deck!==c.deck)));
  const dis=[];for(const x of cands){const f=formOf(x);if(!f||seenF.has(norm(f))||/[¿?¡!]/.test(f))continue;seenF.add(norm(f));dis.push(f);if(dis.length===3)break}
  const fix=s=>cz.start===0?cap(s):s.toLowerCase()===s?s:s;
  const opts=shuffle([answer,...dis.map(fix)]);
  const before=c.ex.slice(0,cz.start),after=c.ex.slice(cz.end);
  paint(`<div class="stage">${top}<div class="panel">
    <div class="eyebrow">Complète la phrase</div>
    <p class="q cloze">${esc(before)}<span class="gap" id="gap">______</span>${esc(after)}</p>
    <p class="hint" style="margin:-6px 0 16px">${esc(c.exFr)}</p>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div></div></div>`);
  let answered=false;
  const pick=i=>{if(answered)return;answered=true;const ok=norm(opts[i])===norm(answer);
    document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(norm(opts[j])===norm(answer))b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    const g=$("gap");g.textContent=answer;g.classList.add("filled");
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?"¡Correcto!":"Pas tout à fait."}</b> « ${esc(c.es)} » = ${esc(c.fr)}. ${sayBtn("sp")}</div>`+nextRow();
    const sp=$("sp");if(sp)sp.onclick=()=>speak(c.ex);speak(c.ex);
    markDay();save();armNext(()=>onDone(ok))};
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length)pick(n-1)};
}

/* --- Remettre dans l'ordre --- */
function orderItem(src,top,onDone){
  const toks=orderTokens(src.es);if(toks.length<2){onDone();return}
  let bank=shuffle(toks.map((t,i)=>({t,i})));
  if(bank.every((b,k)=>b.i===k))bank=bank.slice(1).concat(bank[0]);
  let picked=[];let done=false;
  const draw=()=>{
    paint(`<div class="stage">${top}<div class="panel">
      <div class="eyebrow">Remets les mots dans l'ordre</div>
      <div class="fr" style="font-size:1.4rem">${esc(src.fr)}</div>
      <div class="order-ans" id="ans">${picked.length?picked.map((b,k)=>`<button class="tok on" data-k="${k}" ${done?"disabled":""}>${esc(b.t)}</button>`).join(""):`<span class="hint">Clique sur les mots ci-dessous dans le bon ordre</span>`}</div>
      <div class="order-bank">${bank.map((b,k)=>`<button class="tok" data-b="${k}" ${done?"disabled":""}>${esc(b.t)}</button>`).join("")}</div>
      ${done?"":`<div class="row" style="margin-top:16px"><button class="btn" id="chk" ${bank.length?"disabled":""}>Vérifier</button><button class="btn ghost" id="clr">Recommencer</button><button class="btn ghost" id="giveup">Voir la réponse</button></div>`}
      <div id="fb"></div></div></div>`);
    document.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>{picked.push(bank.splice(+el.dataset.b,1)[0]);draw()});
    document.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{bank.push(picked.splice(+el.dataset.k,1)[0]);draw()});
    if(!done){
      $("clr").onclick=()=>{bank=bank.concat(picked);picked=[];draw()};
      $("chk").onclick=()=>check(false);
      $("giveup").onclick=()=>check(true);
    }
  };
  const check=give=>{
    const ok=!give&&picked.map(b=>norm(b.t)).join(" ")===toks.map(norm).join(" ");
    done=true;draw();
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?"¡Perfecto!":"La bonne phrase :"}</b><br><span style="font-size:1.15rem">${esc(src.es)}</span> ${sayBtn("sp")}</div>`+nextRow();
    const sp=$("sp");if(sp)sp.onclick=()=>speak(src.es);speak(src.es);
    markDay();save();armNext(()=>onDone(ok));
  };
  draw();
}

/* --- Saisie (dictée, écrire, conjugaison) --- */
const ACCENTS=["á","é","í","ó","ú","ñ","ü","¿","¡"];
function inputBlock(){return `<input type="text" id="tin" autocomplete="off" spellcheck="false" lang="es" autocapitalize="off">
   <div class="accents">${ACCENTS.map(a=>`<button data-a="${a}" type="button" aria-label="Insérer ${a}">${a}</button>`).join("")}</div>`}
function bindAccents(){const inp=$("tin");document.querySelectorAll(".accents button").forEach(b=>b.onclick=()=>{const st=inp.selectionStart,en=inp.selectionEnd;inp.value=inp.value.slice(0,st)+b.dataset.a+inp.value.slice(en);inp.focus();inp.selectionStart=inp.selectionEnd=st+1})}
/* compare : renvoie "exact" | "accent" | "" */
function compare(given,targets){
  for(const t of targets){if(soft(given)===soft(t))return "exact"}
  for(const t of targets){if(norm(given)===norm(t))return "accent"}
  return "";
}
function typedItem(o,onDone){
  // o: {top, eyebrow, prompt(html), targets[], show(texte correct), speakText, extraHtml(fn ok)->html, label}
  paint(`<div class="stage">${o.top}<div class="panel">
    <div class="eyebrow">${o.eyebrow}</div>${o.prompt}
    ${inputBlock()}
    <div class="row"><button class="btn" id="chk">Vérifier</button><button class="btn ghost" id="skip">Voir la réponse</button></div>
    <div id="fb"></div></div></div>`);
  const inp=$("tin");inp.focus();bindAccents();if(o.after)o.after();
  let done=false;
  const show=(given)=>{if(done)return;done=true;inp.disabled=true;$("chk").disabled=true;$("skip").disabled=true;
    const res=given?compare(inp.value,o.targets):"";const ok=!!res;
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${res==="exact"?"¡Perfecto!":res==="accent"?"Juste ! Attention aux accents :":given?"Pas tout à fait. La réponse :":"La réponse :"}</b><br><span style="font-size:1.2rem">${esc(o.show)}</span> ${o.speakText?sayBtn("sp"):""}${o.note?`<div class="hint" style="margin-top:6px">${o.note}</div>`:""}</div>${o.extra?o.extra():""}`+nextRow(!ok&&given&&o.allowOverride?`<button class="btn ghost" id="mine">J'avais bon (autre formulation)</button>`:"");
    let final=ok;const sp=$("sp");if(sp)sp.onclick=()=>speak(o.speakText);if(o.speakText)speak(o.speakText);
    const m=$("mine");if(m)m.onclick=()=>{final=true;m.textContent="Compté comme juste ✓";m.disabled=true};
    markDay();save();armNext(()=>onDone(final))};
  $("chk").onclick=()=>{if(!norm(inp.value)){inp.focus();return}show(true)};
  $("skip").onclick=()=>show(false);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!done)$("chk").click();else $("nx").click()}};
}
function writeItem(c,top,onDone){
  if(!c){onDone();return}
  const full=stripEnd(c.es),bare=bareOf(c.es);
  typedItem({top,eyebrow:"Écris le mot en espagnol",prompt:`<div class="fr">${esc(c.fr)}</div><label for="tin" class="hint">${full!==bare?"Avec l'article (el, la…) si possible":"Ta réponse"}</label>`,
    targets:[full,bare],show:c.es,speakText:c.es,note:c.ex?`${esc(c.ex)} · ${esc(c.exFr)}`:""},onDone);
}
function dicteeItem(c,sentence,top,onDone){
  if(!c){onDone();return}
  const text=sentence?c.ex:c.es;const target=sentence?c.ex:stripEnd(c.es);
  typedItem({top,eyebrow:sentence?"Dictée · écris la phrase entendue":"Dictée · écris le mot entendu",
    prompt:`${canSpeak?`<button class="listen-big" id="play" aria-label="Réécouter">🔊</button>`:`<p class="hint">La voix n'est pas disponible : voici le texte à recopier.</p><div class="fr">${esc(text)}</div>`}<label for="tin" class="hint">Ce que tu entends (la ponctuation ne compte pas)</label>`,
    targets:[target],show:text,speakText:null,note:esc(sentence?c.exFr:c.fr),
    after:()=>{const p=$("play");if(p){p.onclick=()=>speak(text);speak(text)}}},onDone);
}
function conjTable(v,te,hi){
  const V=VERBS[v];
  return `<div class="tbl-wrap"><table class="conj"><tr><th colspan="2">${esc(v)} · ${TENSES[te].t}</th></tr>${PERSONS.map((p,i)=>`<tr class="${i===hi?"hl":""}"><td>${p}</td><td class="es">${esc(V[te][i])}</td></tr>`).join("")}</table></div>`;
}
function conjItem(v,te,p,top,onDone){
  const V=VERBS[v];if(!V){onDone();return}
  const ans=V[te][p];
  typedItem({top,eyebrow:"Conjugaison · "+TENSES[te].t,
    prompt:`<div class="conj-q"><span class="pron">${PERSONS[p]}</span><span class="verb">${esc(v)}</span><span class="hint">(${esc(V.fr)})</span></div><label for="tin" class="hint">${TENSES[te].ex} ${PERSONS[p].split(" / ")[0]} …</label>`,
    targets:[ans],show:PERSONS[p].split(" / ")[0]+" "+ans,speakText:ans,extra:()=>conjTable(v,te,p)},onDone);
}

/* --- Quiz --- */
function quizItem(q,top,onDone,opt){
  opt=opt||{};
  const[text,opts,ans,why]=q;
  const order=opt.shuffle?shuffle(opts.map((o,i)=>i)):opts.map((o,i)=>i);
  paint(`<div class="stage">${top}<div class="panel">${opt.eyebrow?`<div class="eyebrow">${esc(opt.eyebrow)}</div>`:""}<p class="q">${esc(text)}</p><div class="choices">${order.map(i=>`<button class="choice" data-i="${i}">${esc(opts[i])}</button>`).join("")}</div>${opt.idk?`<button class="idk" id="idk">Je ne sais pas</button>`:""}<div id="fb"></div></div></div>`);
  let answered=false;
  const pick=i=>{if(answered)return;answered=true;const ok=i===ans;
    if(opt.silent){onDone(ok);return}
    document.querySelectorAll(".choice").forEach(b=>{const j=+b.dataset.i;b.disabled=true;if(j===ans)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    const full=text.includes("___")?text.replace("___",opts[ans]).replace(/\s*\([^)]*\)\s*$/,""):"";
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?"¡Correcto!":"Pas tout à fait."}</b> ${esc(why||"")}${full?`<div class="ex-line">${esc(full)} ${sayBtn("sp")}</div>`:""}</div>`+nextRow();
    const sp=$("sp");if(sp)sp.onclick=()=>speak(full);
    markDay();save();armNext(()=>onDone(ok))};
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const ik=$("idk");if(ik)ik.onclick=()=>pick(-1);
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length)pick(order[n-1])};
}

/* --- Traduction --- */
function transItem(p,top,onDone){
  const[fr,acc,model]=p;
  typedItem({top,eyebrow:"Traduis en espagnol",prompt:`<div class="fr">${esc(fr)}</div><label for="tin" class="hint">Ta réponse (accents conseillés, mais pas obligatoires)</label>`,
    targets:[model,...acc],show:model,speakText:model,allowOverride:true},onDone);
}

/* ================= TEST DE NIVEAU ================= */
function startPlacement(){
  let i=0;const answers=[];
  const step=()=>{
    if(i>=PLACEMENT.length){finishPlacement(answers);return}
    const[q,opts,lv,skill]=PLACEMENT[i];
    quitAction=()=>{view=null;render()};
    const top=`<button class="back" id="quit">← Arrêter le test</button><div class="progress"><span>Test de niveau · ${skill}</span><span>${i+1} / ${PLACEMENT.length}</span></div><div class="bar" style="margin:-4px 0 14px"><i style="width:${Math.round(i/PLACEMENT.length*100)}%"></i></div>`;
    quizItem([q,opts,0,""],top,ok=>{answers.push({lv,skill,ok});i++;step()},{shuffle:true,idk:true,silent:true,eyebrow:"Choisis la bonne réponse"});
  };
  view=step;render();
}
function finishPlacement(ans){
  const by=l=>ans.filter(a=>a.lv===l&&a.ok).length;
  const a1=by(1),a2=by(2),b1=by(3);
  const work=a1<6?1:a2<6?2:3;
  const skills={};ans.forEach(a=>{skills[a.skill]=skills[a.skill]||{ok:0,n:0};skills[a.skill].n++;if(a.ok)skills[a.skill].ok++});
  const label=a1<6?"A1":a2<6?"A1 → A2":b1<6?"A2 → B1":"B1";
  S.level=work;S.placement={date:todayStr(),label,scores:{1:a1,2:a2,3:b1},skills,total:a1+a2+b1};S.session=null;markDay();save();
  view=null;tab="level";render();
}

    $("bk").onclick=()=>{view=null;render()};
    $("vsel").onchange=e=>{refVerb=e.target.value;render()};
    if(canSpeak)document.querySelectorAll(".conj td.es").forEach(td=>{td.style.cursor="pointer";td.onclick=()=>speak(td.textContent)});
  };
  render();
}

/* ================= GRAMMAIRE ================= */
function renderGram(){
  const L=myLevel();
  let html=`<h2>Grammaire</h2><p class="lead">Une leçon courte, puis des exercices pour vérifier. Les leçons suivies alimentent ta séance du jour.</p>`;
  [1,2,3].forEach(l=>{
    html+=`<div class="lvl-head"><h3>${LVL[l]} · ${LVLNAME[l]}</h3>${l===L&&S.level?`<span class="rec">Ton niveau</span>`:""}</div><div class="lessons">`+
    LESSONS.map((x,i)=>[x,i]).filter(([x])=>x.lvl===l).map(([x,i])=>{const r=S.lessons[x.id];return `<button class="lesson-btn" data-i="${i}"><span><b>${x.t}</b><br><span class="lvl">${x.sub}</span></span>${r?`<span class="chip ok">${r.best}/${x.q.length}</span>`:`<span class="chip todo">À découvrir</span>`}</button>`}).join("")+`</div>`;
  });
  paint(html);
  document.querySelectorAll(".lesson-btn").forEach(b=>b.onclick=()=>openLesson(LESSONS[+b.dataset.i]));
}
function openLesson(L){
  const lessonView=()=>{paint(`<button class="back" id="bk">← Toutes les leçons</button><div class="eyebrow">${LVL[L.lvl]} · ${L.sub}</div><h2>${L.t}</h2><div class="lesson-body">${L.html}<div class="row" style="margin-top:18px"><button class="btn sun-btn" id="qz">Faire les ${L.q.length} exercices</button></div></div>`);
    $("bk").onclick=()=>{view=null;render()};
    document.querySelectorAll(".lesson-body td.es").forEach(td=>{if(canSpeak){td.style.cursor="pointer";td.title="Cliquer pour écouter";td.onclick=()=>speak(td.textContent)}});
    $("qz").onclick=()=>runList(shuffle(L.q.map((q,i)=>"g:"+L.id+":"+i)),{title:L.t,backLabel:"Toutes les leçons",onEnd:(sc)=>{const prev=S.lessons[L.id];S.lessons[L.id]={best:Math.max(sc,prev?prev.best:0)};save()},again:()=>{view=lessonView;render()}});
  };
  view=lessonView;render();
}

/* ================= TRADUCTION ================= */
let tradFilter="Tous";
function renderTrad(){
  const seenEx=allCards.filter(c=>!isNew(c)&&c.ex&&c.exFr&&!/[—«]/.test(c.ex));
  const cats=["Tous",...new Set(PHRASES.map(p=>p[3]))];if(seenEx.length>=5)cats.push("Mes mots");
  const pool=()=>tradFilter==="Mes mots"?seenEx.map(c=>"t:e:"+c.id):PHRASES.map((p,i)=>[p,i]).filter(([p])=>tradFilter==="Tous"||p[3]===tradFilter).map(([p,i])=>"t:"+i);
  paint(`<h2>Phrases à traduire</h2><p class="lead">Du français vers l'espagnol. Tape ta traduction : les accents sont conseillés mais pas obligatoires. Si tu as trouvé une autre bonne formulation, tu peux la compter comme juste. « Mes mots » reprend les exemples des mots que tu as déjà vus.</p>
   <div class="filter">${cats.map(c=>`<button aria-pressed="${c===tradFilter}" data-c="${c}">${c}${c==="Récit"?" (B1)":""}</button>`).join("")}</div>
   <div class="row"><button class="btn sun-btn" id="st">Commencer 8 phrases</button><span class="hint">${pool().length} phrases dans cette catégorie</span></div>`);
  document.querySelectorAll(".filter button").forEach(b=>b.onclick=()=>{tradFilter=b.dataset.c;render()});
  $("st").onclick=()=>{const L=myLevel();let p=pool();if(tradFilter==="Tous"){const f=p.filter(k=>PHRASES[+k.slice(2)][4]<=L+1);if(f.length>=8)p=f}
    const go=()=>runList(shuffle(p).slice(0,8),{title:"Traduction",backLabel:"Traduction",again:go});go()};
}

/* ================= DIALOGUES ================= */
function renderDial(){
  paint(`<h2>Dialogues</h2><p class="lead">De petites scènes de la vie en Espagne. Écoute, lis, affiche la traduction si besoin, puis réponds à trois questions de compréhension.</p>
   <div class="lessons">${DIALOGUES.map((d,i)=>{const r=S.dialogues[d.id];return `<button class="lesson-btn" data-i="${i}"><span><b>${d.t}</b> ${badge(d.lvl)}<br><span class="lvl">${d.sub}</span></span>${r!==undefined?`<span class="chip ok">${r}/3</span>`:`<span class="chip todo">À découvrir</span>`}</button>`}).join("")}</div>`);
  document.querySelectorAll(".lesson-btn").forEach(b=>b.onclick=()=>openDialogue(DIALOGUES[+b.dataset.i]));
}
function openDialogue(D){
  let showTr=false;
  const dv=()=>{
    paint(`<button class="back" id="bk">← Tous les dialogues</button><div class="eyebrow">${LVL[D.lvl]} · ${D.sub}</div><h2>${D.t}</h2>
    <div class="row" style="margin-top:12px">${canSpeak?`<button class="btn" id="all">🔊 Écouter tout le dialogue</button>`:""}<button class="btn ghost" id="tr">${showTr?"Masquer":"Afficher"} la traduction</button></div>
    <div class="bubbles">${D.lines.map((l,i)=>`<div class="bubble ${l[0]==="Snoop"?"me":""}"><div class="who"><span>${esc(l[0])}</span>${canSpeak?`<button class="mini" data-l="${i}" aria-label="Écouter cette réplique">🔊</button>`:""}</div><div class="es">${esc(l[1])}</div>${showTr?`<div class="tr">${esc(l[2])}</div>`:""}</div>`).join("")}</div>
    <button class="btn sun-btn" id="qz">Répondre aux 3 questions</button>`);
    $("bk").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}view=null;render()};
    $("tr").onclick=()=>{showTr=!showTr;const y=window.scrollY;render();window.scrollTo({top:y})};
    const all=$("all");if(all)all.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}D.lines.forEach(l=>speak(l[1],true))};
    document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>speak(D.lines[+b.dataset.l][1]));
    $("qz").onclick=()=>{let i=0,sc=0;const step=()=>{if(i>=D.q.length){S.dialogues[D.id]=Math.max(sc,S.dialogues[D.id]||0);markDay();save();
        paint(`<div class="stage"><div class="card done-box"><div class="big">${sc} / 3</div><p>${sc===3?"¡Lo has entendido todo! Tu as tout compris.":"Réécoute le dialogue avec la traduction, puis réessaie."}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="re">Revoir le dialogue</button><button class="btn" id="bk2">Tous les dialogues</button></div></div></div>`);
        $("re").onclick=()=>{view=dv;render()};$("bk2").onclick=()=>{view=null;render()};return}
      const[q,o,a]=D.q[i];quitAction=()=>{view=dv;render()};
      quizItem([q,o,a,""],`<button class="back" id="quit">← Dialogue</button><div class="progress"><span>${esc(D.t)}</span><span>${i+1} / 3</span></div>`,ok=>{if(ok)sc++;i++;step()},{shuffle:true})};
      view=step;render()};
  };
  view=dv;render();
}

/* ================= MON NIVEAU & RÉGLAGES ================= */
function renderLevel(){
  const P=S.placement;const L=myLevel();
  const ladder=[1,2,3].map(l=>{const sc=P?P.scores[l]:null;return `<div class="${S.level===l?"here":""} ${sc!==null&&sc>=6?"ok":""}"><b>${LVL[l]}</b>${LVLNAME[l]}${sc!==null?`<br>${sc}/8`:""}</div>`}).join("");
  const skills=P?Object.entries(P.skills).map(([k,v])=>`<div class="skill"><span>${k}</span><div class="track"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></div><b>${v.ok}/${v.n}</b></div>`).join(""):"";
  const learnedBy=l=>{const cs=allCards.filter(c=>c.lvl===l);return `${cs.filter(isLearned).length}/${cs.length}`};
  const advice={1:"On consolide les bases : salutations, nombres, articles, présent et ser/estar. Les séances piochent surtout dans le niveau A1.",
                2:"Les bases sont là. On travaille le passé composé, gustar, les verbes irréguliers et le vocabulaire du voyage et des courses.",
                3:"Bon niveau ! On s'attaque aux temps du passé (indefinido, imparfait), à por/para et aux expressions pour raconter."}[L];
  const voiceOpts=esVoices.map(v=>`<option value="${esc(v.name)}" ${esVoice&&v.name===esVoice.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  paint(`<h2>Mon niveau et réglages</h2><p class="lead">${P?`Test passé le ${new Date(P.date+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}. C'est une estimation indicative, pas un diplôme : elle sert à choisir les bons exercices.`:"Le test de niveau dure environ 5 minutes. Il sert à adapter les séances à ce que tu sais déjà."}</p>
   <section class="panel" id="voix" style="margin-bottom:20px">
     <div class="eyebrow">Voix espagnole</div>
     ${!canSpeak?`<p>Ce navigateur ne sait pas lire le texte à voix haute. Essaie Google Chrome ou Microsoft Edge.</p>`
      :esVoices.length?`<div class="voice-row"><div><label for="voiceSel" class="hint">Voix utilisée</label><select id="voiceSel" class="sel">${voiceOpts}</select></div>
        <div><label for="rate" class="hint">Vitesse : <b id="rateV">${Math.round((S.rate||.9)*100)} %</b></label><input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.rate||.9}"></div>
        <button class="btn" id="vtest">🔊 Tester</button></div>
        <p class="hint" style="margin:10px 0 0">Les voix marquées « Natural », « Online » ou « Google » sont les plus naturelles. Choisis de préférence une voix « es-ES » (espagnol d'Espagne).</p>`
      :`<p><b>Aucune voix espagnole n'est installée sur cet ordinateur.</b> Le navigateur lit alors l'espagnol avec une voix française, d'où l'accent.</p>`}
     ${canSpeak?`<details ${esVoices.length?"":"open"}><summary>Comment avoir une meilleure voix espagnole</summary>
       <ul class="help">
        <li><b>Le plus simple :</b> ouvrir l'appli dans <b>Microsoft Edge</b> (voix « Elvira Online (Natural) ») ou <b>Google Chrome</b> (voix « Google español »). Elles sont déjà incluses et très naturelles.</li>
        <li><b>Windows :</b> Paramètres → Heure et langue → Voix → Ajouter des voix → choisir « Español (España) ». Fermer puis rouvrir le navigateur.</li>
        <li><b>Mac :</b> Réglages Système → Accessibilité → Contenu énoncé → Voix du système → Gérer les voix → Espagnol (Espagne), par exemple « Mónica ». Puis rouvrir le navigateur.</li>
       </ul></details>`:""}
   </section>
   <div class="two">
    <section class="panel">
      ${P?`<div class="eyebrow">Résultat estimé</div><div class="result-level">${P.label}</div><p class="hint" style="margin:6px 0 0">${P.total} bonnes réponses sur ${PLACEMENT.length}</p>
      <div class="ladder">${ladder}</div><div class="skills">${skills}</div>
      <div class="note">${advice}</div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="retest">Refaire le test</button></div>`
      :`<div class="eyebrow">Pas encore testé</div><h3 style="font-family:var(--f-display);font-weight:400;font-size:1.6rem">Où en es-tu ?</h3><p>24 questions, du plus simple au plus avancé. Si tu ne sais pas, clique sur « Je ne sais pas » plutôt que de deviner : le résultat sera plus juste.</p><button class="btn sun-btn" id="retest">Commencer le test</button>`}
      <div style="margin-top:22px"><span class="hint">Ou choisir le niveau de travail toi-même :</span>
      <div class="filter" style="margin-top:8px">${[1,2,3].map(l=>`<button aria-pressed="${S.level===l}" data-l="${l}">${LVL[l]} · ${LVLNAME[l]}</button>`).join("")}</div></div>
    </section>
    <section class="panel">
      <div class="eyebrow">Ma progression</div>
      <div class="stats" style="margin:12px 0 18px">
        ${[1,2,3].map(l=>`<div class="stat"><b>${learnedBy(l)}</b><span>mots ${LVL[l]} retenus</span></div>`).join("")}
        <div class="stat"><b>${Object.keys(S.dialogues).length}/${DIALOGUES.length}</b><span>dialogues compris</span></div>
      </div>
      <h3>Sauvegarder ma progression</h3>
      <p class="hint" style="margin:0 0 10px">La progression reste dans ce navigateur. Pour la garder en sécurité ou la passer sur un autre ordinateur, copie ce code et garde-le (dans un mail à toi-même par exemple).</p>
      <textarea id="code" readonly></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="copy">Copier le code</button></div><div class="msg" id="copyMsg"></div>
      <h3 style="margin-top:20px">Restaurer une sauvegarde</h3>
      <textarea id="imp" placeholder="Colle ici un code de sauvegarde"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="restore">Restaurer</button></div><div class="msg" id="impMsg"></div>
    </section>
   </div>`);
  $("retest").onclick=startPlacement;
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.level=+b.dataset.l;S.session=null;save();render()});
  const vs=$("voiceSel");if(vs)vs.onchange=()=>{S.voiceName=vs.value;save();loadVoices();speak("Hola, ¿qué tal?")};
  const rt=$("rate");if(rt)rt.oninput=()=>{S.rate=+rt.value;$("rateV").textContent=Math.round(S.rate*100)+" %";save()};
  const vt=$("vtest");if(vt)vt.onclick=()=>speak("Hola, me llamo Snoop y estoy aprendiendo español. ¡Qué bonito día hace hoy!");
  const exp=Object.assign({},S,{session:null});
  let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(exp))))}catch(e){}
  $("code").value=code;
  $("copy").onclick=()=>{const t=$("code");const ok=()=>{$("copyMsg").className="msg ok";$("copyMsg").textContent="Code copié."};
    const fb=()=>{t.focus();t.select();try{document.execCommand("copy");ok()}catch(e){$("copyMsg").className="msg";$("copyMsg").textContent="Le code est sélectionné : fais Ctrl+C pour le copier."}};
    try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(e){fb()}};
  let armed=false;
  $("restore").onclick=()=>{const m=$("impMsg");let data;
    try{data=JSON.parse(decodeURIComponent(escape(atob($("imp").value.trim()))));if(!data||typeof data!=="object"||!data.cards)throw 0}catch(e){m.className="msg ko";m.textContent="Ce code n'est pas reconnu. Vérifie qu'il a été copié en entier.";return}
    if(!armed){armed=true;m.className="msg";m.textContent="La progression actuelle sera remplacée. Clique encore sur « Restaurer » pour confirmer.";$("restore").textContent="Confirmer la restauration";return}
    S=Object.assign(blank(),data);S.session=null;save();loadVoices();m.className="msg ok";m.textContent="Progression restaurée.";setTimeout(render,700)};
}

render();

</script>
</body>
</html>
