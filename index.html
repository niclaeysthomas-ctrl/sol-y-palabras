<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apprendre l'espagnol en douceur : séance du jour, flashcards, grammaire, dialogues et test de niveau.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='24' fill='%23F2A81D'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1F4FA8">
<title>Sol y Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: azulejo-tiled header band with a sun, then a single focused column; the card in play is the hero. */
:root{
  --bg:#FBF8F1;            /* whitewashed wall */
  --surface:#FFFFFF;
  --ink:#1B2440;           /* deep cobalt ink */
  --muted:#5E6785;
  --line:#E3DDCC;
  --cobalt:#1F4FA8;        /* azulejo blue */
  --cobalt-soft:#E6EDFA;
  --saffron:#F2A81D;       /* sun */
  --saffron-soft:#FDF0D3;
  --ok:#2E8B57; --ok-soft:#E3F3EA;
  --bad:#C0392B; --bad-soft:#FBE7E4;
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A;--surface:#182040;--ink:#F2EEE3;--muted:#A6AEC8;--line:#2A3459;
  --cobalt:#7FA4F0;--cobalt-soft:#1F2C55;--saffron:#F5B83D;--saffron-soft:#3A3020;
  --ok:#5CC48A;--ok-soft:#173828;--bad:#F07B6E;--bad-soft:#3F1F1F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A;--surface:#182040;--ink:#F2EEE3;--muted:#A6AEC8;--line:#2A3459;
  --cobalt:#7FA4F0;--cobalt-soft:#1F2C55;--saffron:#F5B83D;--saffron-soft:#3A3020;
  --ok:#5CC48A;--ok-soft:#173828;--bad:#F07B6E;--bad-soft:#3F1F1F;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Header band */
.band{position:relative;overflow:hidden;background:var(--cobalt);color:#fff;padding-block:28px 0}
.tiles{position:absolute;inset:0;opacity:.16;background-image:
  radial-gradient(circle at 50% 50%, transparent 9px, #fff 10px, #fff 12px, transparent 13px),
  linear-gradient(45deg, transparent 46%, #fff 47%, #fff 53%, transparent 54%),
  linear-gradient(-45deg, transparent 46%, #fff 47%, #fff 53%, transparent 54%);
  background-size:48px 48px}
.band-in{position:relative;max-width:880px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sun{width:74px;height:74px;flex:none}
.sun circle{fill:var(--saffron)} .sun path{stroke:var(--saffron)}
@media (prefers-reduced-motion:no-preference){.sun g{animation:spin 60s linear infinite;transform-origin:50px 50px}}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:2.3rem;margin:0;line-height:1.05;letter-spacing:.01em}
.brand p{margin:4px 0 0;opacity:.88;font-size:1rem}
.streak{margin-left:auto;text-align:right;font-size:.95rem}
.streak b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1;color:var(--saffron)}
nav{position:relative;max-width:880px;margin:22px auto 0;padding-inline:20px;display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.82;padding:12px 18px;border-radius:12px 12px 0 0;font-weight:600;font-size:1rem}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0 0 6px;text-wrap:balance}
h3{font-size:1.15rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt);font-weight:700}

/* Today */
.today{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:720px){.today{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.hero-panel{background:var(--saffron-soft);border-color:transparent}
.plan{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:10px}
.plan li{display:flex;align-items:center;gap:12px;font-weight:500}
.plan .n{font-variant-numeric:tabular-nums;min-width:2.2em;height:2.2em;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--cobalt)}
.plan li.done{color:var(--muted);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.9rem;color:var(--muted)}
.week{display:flex;gap:6px;margin-top:18px}
.week div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.week i{display:block;height:28px;border-radius:6px;background:var(--line);margin-bottom:4px}
.week i.on{background:var(--saffron)}
.tip{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px}
.tip .es{font-family:var(--f-display);font-size:1.3rem}

.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;background:var(--cobalt);color:#fff;font-size:1.02rem}
.btn:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn{color:#10162A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10162A}}
.btn.sun-btn{background:var(--saffron);color:#1B2440}
.btn.ghost{background:transparent;color:var(--cobalt);border:2px solid var(--cobalt)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.deck{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink)}
.deck:hover{border-color:var(--cobalt)}
.deck .t{font-weight:700;font-size:1.05rem}
.deck .m{font-size:.88rem;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron)}
.due{display:inline-block;font-size:.78rem;font-weight:700;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:2px 9px;margin-top:8px}

/* Flashcard */
.stage{max-width:620px;margin:0 auto}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 28px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;box-shadow:0 10px 30px -18px rgba(27,36,64,.35)}
.card .side{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .word{font-family:var(--f-display);font-size:2.4rem;line-height:1.15;text-wrap:balance}
.card .ans{font-family:var(--f-display);font-size:2rem;color:var(--cobalt)}
.card .ex{color:var(--muted);font-style:italic;font-size:1rem}
.say{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media (max-width:520px){.grades{grid-template-columns:repeat(2,1fr)}}
.grades button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px;font-weight:700}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.grades .g0{border-color:var(--bad)} .grades .g3{border-color:var(--ok)}
.keys{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:var(--f-body);font-size:.8rem;background:var(--surface)}

/* Grammar */
.lessons{display:grid;gap:10px}
.lesson-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:var(--ink)}
.lesson-btn:hover{border-color:var(--cobalt)}
.lesson-btn .lvl{font-size:.8rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.todo{background:var(--saffron-soft);color:#8A5A00}
:root[data-theme="dark"] .chip.todo{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.todo{color:var(--saffron)}}
.lesson-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:70ch}
.lesson-body p{margin:0 0 12px}
.tbl-wrap{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;min-width:300px}
th,td{text-align:left;padding:7px 16px 7px 0;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.es{font-weight:700;color:var(--cobalt)}
.note{background:var(--cobalt-soft);border-radius:10px;padding:12px 16px;margin:12px 0}

/* Quiz & translation */
.q{font-size:1.35rem;font-weight:600;margin:0 0 16px;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:1.05rem}
.choice:hover:not(:disabled){border-color:var(--cobalt)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;padding:12px 16px;border-radius:10px}
.feedback.ok{background:var(--ok-soft)} .feedback.ko{background:var(--bad-soft)}
.fr{font-family:var(--f-display);font-size:1.7rem;line-height:1.25;margin:4px 0 18px;text-wrap:balance}
input[type=text]{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=text]:focus{border-color:var(--cobalt);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.accents button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:40px;padding:6px 10px;font-size:1.05rem}
.hint{color:var(--muted);font-size:.92rem}
.done-box{text-align:center;padding:30px 10px}
.done-box .big{font-family:var(--f-display);font-size:2.6rem;color:var(--cobalt)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.92rem}
.filter button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.back{background:none;border:0;color:var(--cobalt);font-weight:700;padding:0;margin-bottom:14px}
footer{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 30px;color:var(--muted);font-size:.85rem}

body{font-size:18px}
nav button{padding:12px 15px}
@media (max-width:640px){nav button{padding:10px 10px;font-size:.92rem}}
.lvl-badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--cobalt-soft);color:var(--cobalt)}
.lvl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.lvl-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.lvl-head .hint{font-size:.9rem}
.rec{font-size:.75rem;font-weight:700;color:#8A5A00;background:var(--saffron-soft);border-radius:999px;padding:2px 9px}
:root[data-theme="dark"] .rec{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rec{color:var(--saffron)}}
.welcome{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--cobalt);color:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:20px}
.welcome h2{color:#fff}
.welcome p{margin:0 0 14px;opacity:.92;max-width:58ch}
.welcome .big-sun{width:70px;height:70px}
.welcome .big-sun circle{fill:var(--saffron)}
.welcome .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
:root[data-theme="dark"] .welcome{background:var(--cobalt-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .welcome{background:var(--cobalt-soft)}}
@media (max-width:560px){.welcome{grid-template-columns:1fr}.welcome .big-sun{display:none}}
.idk{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:12px;padding:4px 0;font-size:.95rem}
.result-level{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--cobalt)}
.skills{display:grid;gap:12px;margin:18px 0}
.skill{display:grid;grid-template-columns:140px 1fr 56px;gap:12px;align-items:center;font-size:.95rem}
@media (max-width:480px){.skill{grid-template-columns:100px 1fr 48px}}
.skill .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.skill .track i{display:block;height:100%;background:var(--cobalt);border-radius:6px}
.skill b{text-align:right;font-variant-numeric:tabular-nums}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.ladder div{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.ladder div b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--ink)}
.ladder div.here{border-color:var(--saffron);background:var(--saffron-soft);color:var(--ink)}
.ladder div.ok b{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
textarea{width:100%;min-height:90px;font:inherit;font-size:.85rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;word-break:break-all}
textarea:focus{border-color:var(--cobalt);outline:none}
.msg{margin-top:10px;font-size:.95rem}
.msg.ok{color:var(--ok)} .msg.ko{color:var(--bad)}
/* dialogues */
.bubbles{display:grid;gap:12px;margin:16px 0 22px}
.bubble{max-width:82%;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 16px;justify-self:start}
.bubble.me{justify-self:end;background:var(--cobalt-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble .who{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.bubble .es{font-size:1.12rem;margin-top:2px}
.bubble .tr{color:var(--muted);font-style:italic;font-size:.95rem;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.82rem}
.bubble .mini{flex:none}
.listen-card{text-align:center}
.listen-big{width:110px;height:110px;border-radius:50%;border:0;background:var(--saffron);color:#1B2440;font-size:2.6rem;margin:6px auto 12px;display:grid;place-items:center;box-shadow:0 10px 26px -14px rgba(242,168,29,.9)}
.listen-big:hover{filter:brightness(1.05)}
.shown-word{font-family:var(--f-display);font-size:1.6rem;color:var(--cobalt);min-height:1.6em}
</style>
</head>
<body>
<header class="band">
  <div class="tiles" aria-hidden="true"></div>
  <div class="band-in">
    <svg class="sun" viewBox="0 0 100 100" aria-hidden="true"><g><circle cx="50" cy="50" r="20"/><path d="M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20L70 30M30 70L20 80" stroke-width="6" stroke-linecap="round"/></g></svg>
    <div class="brand">
      <h1>Sol y Palabras</h1>
      <p id="greet">¡Buenos días! Un poco d'espagnol chaque jour.</p>
    </div>
    <div class="streak"><b id="streakN">0</b>jours de suite</div>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Aujourd'hui</button>
    <button role="tab" data-tab="vocab" aria-selected="false">Vocabulaire</button>
    <button role="tab" data-tab="gram" aria-selected="false">Grammaire</button>
    <button role="tab" data-tab="trad" aria-selected="false">Traduction</button>
    <button role="tab" data-tab="dial" aria-selected="false">Dialogues</button>
    <button role="tab" data-tab="level" aria-selected="false">Mon niveau</button>
  </nav>
</header>
<main id="app"></main>
<footer>Ta progression est gardée dans ce navigateur. Pense à la sauvegarder de temps en temps depuis « Mon niveau ».</footer>
<script>
/* ================= CONTENU — Sol y Palabras ================= */

const DECKS = {

  familia:{t:"Famille et gens",lvl:1,w:[

 {id:"articles",lvl:1,t:"Le, la, les : el, la, los, las",sub:"Genre et articles",html:`
 <p>Comme en français, les noms sont masculins ou féminins. En général : <b>-o</b> → masculin, <b>-a</b> → féminin.</p>
 <div class="tbl-wrap"><table><tr><th></th><th>singulier</th><th>pluriel</th></tr>

 <tr><td>féminin</td><td class="es">la / una</td><td class="es">las / unas</td></tr></table></div>
 <div class="note"><b>Pièges :</b> <i>el día</i>, <i>el mapa</i>, <i>el problema</i> sont masculins. <i>La mano</i> est féminin. Et <i>el agua</i> est féminin mais prend « el » pour la sonorité.</div>`,

 {id:"ser-estar",lvl:1,t:"Ser ou estar ?",sub:"Les deux verbes « être »",html:`
 <p><b>Ser</b> décrit ce qui définit : identité, origine, métier, caractère, l'heure.<br><b>Estar</b> décrit un état passager ou un lieu : humeur, santé, où l'on se trouve.</p>
 <div class="tbl-wrap"><table><tr><th></th><th>ser</th><th>estar</th></tr>
 <tr><td>yo</td><td class="es">soy</td><td class="es">estoy</td></tr><tr><td>tú</td><td class="es">eres</td><td class="es">estás</td></tr>
 <tr><td>él / ella / usted</td><td class="es">es</td><td class="es">está</td></tr><tr><td>nosotros</td><td class="es">somos</td><td class="es">estamos</td></tr>
 <tr><td>vosotros</td><td class="es">sois</td><td class="es">estáis</td></tr><tr><td>ellos / ustedes</td><td class="es">son</td><td class="es">están</td></tr></table></div>
 <div class="note"><b>Astuce :</b> <i>Soy francesa</i> (je le suis toujours) mais <i>Estoy cansada</i> (fatiguée aujourd'hui). <i>La playa está lejos</i> : un lieu, donc estar.</div>`,

    ["Nosotros ___ en Madrid.",["somos","estamos"],1,"Où l'on se trouve : estar."]]},
 {id:"present",lvl:1,t:"Le présent : -ar, -er, -ir",sub:"Verbes réguliers",html:`
 <p>On enlève la terminaison de l'infinitif et on ajoute celle de la personne. En espagnol, le pronom est souvent omis : <i>hablo</i> suffit pour « je parle ».</p>
 <div class="tbl-wrap"><table><tr><th></th><th>hablar</th><th>comer</th><th>vivir</th></tr>
 <tr><td>yo</td><td class="es">hablo</td><td class="es">como</td><td class="es">vivo</td></tr>
 <tr><td>tú</td><td class="es">hablas</td><td class="es">comes</td><td class="es">vives</td></tr>
 <tr><td>él / ella / usted</td><td class="es">habla</td><td class="es">come</td><td class="es">vive</td></tr>
 <tr><td>nosotros</td><td class="es">hablamos</td><td class="es">comemos</td><td class="es">vivimos</td></tr>
 <tr><td>vosotros</td><td class="es">habláis</td><td class="es">coméis</td><td class="es">vivís</td></tr>

 <div class="note"><b>Usted</b> (vous de politesse) se conjugue comme él/ella : <i>¿Usted habla francés?</i></div>`,

 {id:"questions",lvl:1,t:"Poser des questions",sub:"Les mots interrogatifs",html:`
 <p>Les mots de question portent toujours un accent. Et on ouvre la question avec <b>¿</b> à l'envers.</p>

 <tr><td class="es">¿Qué?</td><td>Quoi ? Que ?</td></tr><tr><td class="es">¿Dónde?</td><td>Où ?</td></tr>

 <tr><td class="es">¿Cómo?</td><td>Comment ?</td></tr><tr><td class="es">¿Por qué?</td><td>Pourquoi ?</td></tr>
 <tr><td class="es">¿Quién?</td><td>Qui ?</td></tr></table></div>

 {id:"gustar",lvl:2,t:"Me gusta, me gustan",sub:"Dire ce qu'on aime",html:`
 <p><b>Gustar</b> fonctionne à l'envers du français : c'est la chose qui « plaît ». On accorde le verbe avec la chose aimée.</p>

 <tr><td>à lui / elle / vous</td><td class="es">le gusta</td><td class="es">le gustan</td></tr>
 <tr><td>à nous</td><td class="es">nos gusta</td><td class="es">nos gustan</td></tr></table></div>
 <div class="note"><i>Me gusta el vino</i> · <i>Me gustan las tapas</i> · <i>Me gusta bailar</i> (un verbe = singulier). Même logique pour <b>me duele / me duelen</b> : <i>me duelen los pies</i>.</div>`,

 {id:"reflexivos",lvl:2,t:"Me levanto, me acuesto",sub:"Les verbes pronominaux",html:`

 {id:"perfecto",lvl:2,t:"Le passé composé",sub:"He comido, hemos visitado",html:`
 <p>Il se forme avec <b>haber</b> (jamais « être ») + participe : <b>-ar → -ado</b>, <b>-er/-ir → -ido</b>.</p>

 <div class="note"><b>Irréguliers fréquents :</b> hecho (fait), visto (vu), dicho (dit), escrito (écrit), vuelto (revenu), puesto (mis).<br>En Espagne, on l'utilise pour ce qui s'est passé aujourd'hui ou récemment : <i>Hoy he comido paella.</i></div>`,

 {id:"indefinido",lvl:3,t:"Le passé simple (indefinido)",sub:"Ayer fui, el año pasado visité",html:`

const KEY="solypalabras-v1";
const LVL={1:"A1",2:"A2",3:"B1"};

const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const blank=()=>({cards:{},lessons:{},dialogues:{},days:[],session:null,level:null,placement:null,skipTest:false});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const myLevel=()=>S.level||1;

const allCards=[];for(const k in DECKS)DECKS[k].w.forEach((w,i)=>allCards.push({id:k+":"+i,deck:k,lvl:DECKS[k].lvl,es:w[0],fr:w[1],ex:w[2]}));
const cardById=id=>allCards.find(c=>c.id===id);
const isDue=c=>{const s=S.cards[c.id];return s&&s.due<=todayStr()};
const isNew=c=>!S.cards[c.id];

function grade(id,g){ // 0 à revoir, 1 difficile, 2 bien, 3 facile
  const s=S.cards[id]||{iv:0,ease:2.5,reps:0};
  if(g===0){s.iv=0;s.reps=0;s.ease=Math.max(1.3,s.ease-.2)}
  else{
    if(s.reps===0)s.iv=g===3?3:1; else if(s.reps===1)s.iv=g===1?2:(g===3?7:4);
    else s.iv=Math.round(s.iv*(g===1?1.2:g===3?s.ease*1.3:s.ease));
    s.ease=Math.max(1.3,s.ease+(g===1?-.15:g===3?.1:0));s.reps++;
  }
  s.due=addDays(todayStr(),s.iv);S.cards[id]=s;markDay();save();
}
function markDay(){const t=todayStr();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-120)}}
function streak(){let n=0,d=todayStr();if(!S.days.includes(d))d=addDays(d,-1);while(S.days.includes(d)){n++;d=addDays(d,-1)}return n}

/* Voix espagnole */
const canSpeak=typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined";
let esVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();esVoice=v.find(x=>x.lang==="es-ES")||v.find(x=>x.lang&&x.lang.startsWith("es"))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speak(t,queue){if(!canSpeak)return;try{const u=new SpeechSynthesisUtterance(t.replace(/…/g,""));u.lang="es-ES";if(esVoice)u.voice=esVoice;u.rate=.85;if(!queue)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:'"«»]/g,"").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= SÉANCE DU JOUR ================= */
function levelOrder(items,get){const L=myLevel();return items.slice().sort((a,b)=>{const da=Math.abs(get(a)-L)+(get(a)>L?.5:0),db=Math.abs(get(b)-L)+(get(b)>L?.5:0);return da-db})}
function buildSession(){
  const L=myLevel();
  const due=shuffle(allCards.filter(isDue)).slice(0,10);
  const freshPool=levelOrder(allCards.filter(c=>isNew(c)&&c.lvl<=Math.min(3,L+1)),c=>c.lvl);
  const fresh=freshPool.slice(0,Math.max(4,10-due.length));
  const vocab=[...due,...fresh].slice(0,12).map(c=>c.id);
  const known=allCards.filter(c=>!isNew(c)&&c.lvl<=L);
  const listenPool=(known.length>=6?known:allCards.filter(c=>c.lvl<=L));
  const listen=shuffle(listenPool).slice(0,4).map(c=>c.id);
  const lessonPool=LESSONS.filter(l=>S.lessons[l.id]||l.lvl===L);
  const gram=shuffle(lessonPool.flatMap(l=>l.q.map((q,i)=>l.id+":"+i))).slice(0,4);
  const tradPool=PHRASES.map((p,i)=>({p,i})).filter(o=>o.p[4]<=L);
  const trad=shuffle(tradPool).slice(0,3).map(o=>o.i);
  return {date:todayStr(),steps:[{k:"vocab",items:vocab},{k:"listen",items:listen},{k:"gram",items:gram},{k:"trad",items:trad}],step:0,idx:0,score:0,total:0,done:false};
}
function getSession(){if(!S.session||S.session.date!==todayStr()||!S.session.steps||S.session.steps.length!==4){S.session=buildSession();save()}return S.session}

     <div><h2>¡Bienvenida!</h2><p>Pour commencer, un petit test de niveau : 24 questions, environ 5 minutes. Les séances seront ensuite adaptées à ce que tu sais déjà.</p>
     <div class="row"><button class="btn sun-btn" id="startTest">Faire le test de niveau</button><button class="btn ghost" id="skipTest">Plus tard</button></div></div></section>`:"";
  app.innerHTML=welcome+`<div class="today">

     <div class="eyebrow">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div>
     <h2>${s.done?"¡Muy bien! Séance terminée":"Ta séance du jour"}</h2>
     <p class="lead" style="margin:0">${s.done?`Score aux exercices : ${s.score} / ${s.total}. Reviens demain pour la suivante, ou continue librement dans les onglets.`:`Environ 15 minutes, au niveau ${badge(myLevel())}. On mélange révision et nouveautés.`}</p>
     <ul class="plan">${plan}</ul>
     <div class="row">${s.done?`<button class="btn ghost" id="again">Refaire une séance</button>`:`<button class="btn sun-btn" id="go">${s.step||s.idx?"Reprendre":"¡Empezamos!"}</button>`}</div>
   </section>
   <section class="panel">
     <div class="stats">
       <div class="stat"><b>${learned}</b><span>mots bien retenus</span></div>
       <div class="stat"><b>${dueN}</b><span>mots à revoir</span></div>
       <div class="stat"><b>${Object.keys(S.lessons).length}/${LESSONS.length}</b><span>leçons suivies</span></div>
       <div class="stat"><b>${S.level?LVL[S.level]:"?"}</b><span>${S.level?"ton niveau de travail":"niveau pas encore testé"}</span></div>
     </div>
     <div class="week">${days.join("")}</div>
     <div class="tip"><div class="eyebrow">L'expression du jour</div><div class="es">${tip[0]} <button class="mini" id="tipSay" aria-label="Écouter">🔊</button></div><div class="hint">${tip[1]}</div></div>

function sessionView(){
  const s=getSession();
  if(s.step>=s.steps.length){s.done=true;markDay();save();
    app.innerHTML=`<div class="stage"><div class="card done-box"><div class="big">¡Enhorabuena!</div><p>Séance terminée. Score aux exercices : <b>${s.score} / ${s.total}</b>.</p><p class="hint">À demain pour la suite. Hasta mañana.</p><div class="row" style="justify-content:center"><button class="btn" id="home">Retour à l'accueil</button></div></div></div>`;
    $("home").onclick=()=>{view=null;tab="today";render()};return}
  const st=s.steps[s.step];
  if(!st.items.length){s.step++;s.idx=0;save();render();return}
  const next=(ok)=>{if(ok!==undefined&&st.k!=="vocab"){s.total++;if(ok)s.score++}s.idx++;if(s.idx>=st.items.length){s.step++;s.idx=0}save();render()};
  const lbl=["Vocabulaire","Écoute","Grammaire","Traduction"][s.step];
  const top=`<button class="back" id="quit">← Pause</button><div class="progress"><span>Étape ${s.step+1} sur 4 · ${lbl}</span><span>${s.idx+1} / ${st.items.length}</span></div>`;
  const id=st.items[s.idx];
  quitAction=()=>{view=null;render()};
  if(st.k==="vocab")flashcard(cardById(id),top,()=>next());
  else if(st.k==="listen")listenItem(cardById(id),top,next);
  else if(st.k==="gram"){const[lid,qi]=id.split(":");const L=LESSONS.find(l=>l.id===lid);if(!L){next();return}quizItem(L.q[+qi],top,next)}
  else transItem(PHRASES[id],top,next);
  $("quit").onclick=()=>{view=null;render()};
}

/* --- Flashcard --- */
function flashcard(c,top,onDone){
  if(!c){onDone();return}
  let shown=false;const fresh=isNew(c);
  const draw=()=>{
    app.innerHTML=`<div class="stage">${top}
     <div class="card">${canSpeak?`<button class="say" id="say" aria-label="Écouter la prononciation">🔊 Écouter</button>`:""}
       <div class="side">${fresh?"Nouveau mot · ":""}Espagnol</div><div class="word">${esc(c.es)}</div>
       ${shown?`<div class="ans">${esc(c.fr)}</div>${c.ex?`<div class="ex">${esc(c.ex)}</div>`:""}`:""}
     </div>
     ${shown?`<div class="grades">
        <button class="g0" data-g="0">À revoir<small>demain</small></button>
        <button data-g="1">Difficile<small>bientôt</small></button>
        <button data-g="2">Bien<small>plus tard</small></button>
        <button class="g3" data-g="3">Facile<small>beaucoup plus tard</small></button></div>
        <div class="keys">Raccourcis : <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></div>`
      :`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="flip">Voir la réponse</button></div><div class="keys">ou appuie sur <kbd>Espace</kbd></div>`}
    </div>`;
    const sy=$("say");if(sy)sy.onclick=()=>speak(c.es+(shown&&c.ex?". "+c.ex:""));
    const fl=$("flip");if(fl)fl.onclick=()=>{shown=true;draw();speak(c.es)};
    document.querySelectorAll(".grades button").forEach(b=>b.onclick=()=>{grade(c.id,+b.dataset.g);onDone()});
    bindQuit();
  };
  keyHandler=e=>{if(!shown&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();shown=true;draw();speak(c.es)}else if(shown&&["1","2","3","4"].includes(e.key)){grade(c.id,+e.key-1);onDone()}};
  draw();
}

/* --- Écoute --- */
function listenItem(c,top,onDone){
  if(!c){onDone();return}
  const pool=shuffle(allCards.filter(x=>x.id!==c.id&&x.fr!==c.fr&&Math.abs(x.lvl-c.lvl)<=1)).slice(0,3);
  const opts=shuffle([c,...pool]);
  app.innerHTML=`<div class="stage">${top}<div class="panel listen-card">
    <div class="eyebrow">Écoute et choisis le sens</div>
    ${canSpeak?`<button class="listen-big" id="play" aria-label="Réécouter">🔊</button><div class="hint">Clique sur le soleil pour réécouter</div>`:`<p class="hint">La voix n'est pas disponible sur ce navigateur : lis le mot.</p>`}
    <div class="shown-word" id="sw">${canSpeak?"":esc(c.es)}</div>
    <div class="choices" style="text-align:left;margin-top:14px">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o.fr)}</button>`).join("")}</div>
    <div id="fb"></div></div></div>`;
  if(canSpeak){$("play").onclick=()=>speak(c.es);speak(c.es)}
  let answered=false;
  const pick=i=>{if(answered)return;answered=true;const ok=opts[i].id===c.id;
    document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(opts[j].id===c.id)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    $("sw").textContent=c.es;
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}" style="text-align:left"><b>${ok?"¡Muy bien!":"Pas tout à fait."}</b> « ${esc(c.es)} » veut dire « ${esc(c.fr)} ».</div><div class="row" style="margin-top:14px"><button class="btn" id="nx">Continuer</button></div>`;
    markDay();save();const nx=$("nx");nx.focus();nx.onclick=()=>onDone(ok)};
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length)pick(n-1)};
}

/* --- Quiz --- */
function quizItem(q,top,onDone,opt){
  opt=opt||{};
  const[text,opts,ans,why]=q;
  const order=opt.shuffle?shuffle(opts.map((o,i)=>i)):opts.map((o,i)=>i);
  app.innerHTML=`<div class="stage">${top}<div class="panel">${opt.eyebrow?`<div class="eyebrow">${opt.eyebrow}</div>`:""}<p class="q">${esc(text)}</p><div class="choices">${order.map(i=>`<button class="choice" data-i="${i}">${esc(opts[i])}</button>`).join("")}</div>${opt.idk?`<button class="idk" id="idk">Je ne sais pas</button>`:""}<div id="fb"></div></div></div>`;
  let answered=false;
  const pick=i=>{if(answered)return;answered=true;const ok=i===ans;
    if(opt.silent){onDone(ok);return}
    document.querySelectorAll(".choice").forEach(b=>{const j=+b.dataset.i;b.disabled=true;if(j===ans)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?"¡Correcto!":"Pas tout à fait."}</b> ${esc(why||"")}</div><div class="row" style="margin-top:14px"><button class="btn" id="nx">Continuer</button></div>`;
    markDay();save();const nx=$("nx");nx.focus();nx.onclick=()=>onDone(ok)};
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const ik=$("idk");if(ik)ik.onclick=()=>pick(-1);
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length)pick(order[n-1])};
}

/* --- Traduction --- */
function transItem(p,top,onDone){
  const[fr,acc,model]=p;
  app.innerHTML=`<div class="stage">${top}<div class="panel">
   <div class="eyebrow">Traduis en espagnol</div><div class="fr">${esc(fr)}</div>
   <label for="tin" class="hint">Ta réponse (les accents ne sont pas obligatoires)</label>
   <input type="text" id="tin" autocomplete="off" spellcheck="false" lang="es">
   <div class="accents">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(a=>`<button data-a="${a}" type="button">${a}</button>`).join("")}</div>
   <div class="row"><button class="btn" id="chk">Vérifier</button><button class="btn ghost" id="skip">Voir la réponse</button></div>
   <div id="fb"></div></div></div>`;
  const inp=$("tin");inp.focus();
  document.querySelectorAll(".accents button").forEach(b=>b.onclick=()=>{const st=inp.selectionStart,en=inp.selectionEnd;inp.value=inp.value.slice(0,st)+b.dataset.a+inp.value.slice(en);inp.focus();inp.selectionStart=inp.selectionEnd=st+1});
  let done=false;
  const show=(ok,given)=>{if(done)return;done=true;inp.disabled=true;
    $("chk").disabled=true;$("skip").disabled=true;
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?"¡Perfecto!":given?"Presque ! La réponse attendue :":"La réponse :"}</b><br><span style="font-size:1.15rem">${esc(model)}</span> ${canSpeak?`<button class="mini" style="margin-left:8px" id="sp" aria-label="Écouter">🔊</button>`:""}</div>
      <div class="row" style="margin-top:14px"><button class="btn" id="nx">Continuer</button>${!ok&&given?`<button class="btn ghost" id="mine">J'avais bon (autre formulation)</button>`:""}</div>`;
    let res=ok;const sp=$("sp");if(sp)sp.onclick=()=>speak(model);speak(model);
    const m=$("mine");if(m)m.onclick=()=>{res=true;m.textContent="Compté comme juste ✓";m.disabled=true};
    const nx=$("nx");nx.focus();nx.onclick=()=>onDone(res);markDay();save()};
  $("chk").onclick=()=>{const v=norm(inp.value);if(!v){inp.focus();return}show(acc.some(a=>norm(a)===v),true)};
  $("skip").onclick=()=>show(false,false);
  inp.onkeydown=e=>{if(e.key==="Enter")$("chk").click()};
}

/* ================= TEST DE NIVEAU ================= */
function startPlacement(){
  let i=0;const answers=[];
  const step=()=>{
    if(i>=PLACEMENT.length){finishPlacement(answers);return}
    const[q,opts,lv,skill]=PLACEMENT[i];
    const top=`<button class="back" id="quit">← Arrêter le test</button><div class="progress"><span>Test de niveau · ${skill}</span><span>${i+1} / ${PLACEMENT.length}</span></div><div class="bar" style="margin:-4px 0 14px"><i style="width:${Math.round(i/PLACEMENT.length*100)}%"></i></div>`;
    quizItem([q,opts,0,""],top,ok=>{answers.push({lv,skill,ok});i++;step()},{shuffle:true,idk:true,silent:true,eyebrow:"Choisis la bonne réponse"});
    $("quit").onclick=()=>{view=null;render()};
  };
  view=step;render();
}
function finishPlacement(ans){
  const by=l=>ans.filter(a=>a.lv===l&&a.ok).length;
  const a1=by(1),a2=by(2),b1=by(3);
  const work=a1<6?1:a2<6?2:3;
  const skills={};ans.forEach(a=>{skills[a.skill]=skills[a.skill]||{ok:0,n:0};skills[a.skill].n++;if(a.ok)skills[a.skill].ok++});
  const label=a1<6?"A1":a2<6?"A1 → A2":b1<6?"A2 → B1":"B1";
  S.level=work;S.placement={date:todayStr(),label,scores:{1:a1,2:a2,3:b1},skills,total:a1+a2+b1};S.session=null;markDay();save();
  view=null;tab="level";render();
}

function runDeck(list,title){

function openDialogue(D){

    app.innerHTML=`<button class="back" id="bk">← Tous les dialogues</button><div class="eyebrow">${LVL[D.lvl]} · ${D.sub}</div><h2>${D.t}</h2>
    <div class="row" style="margin-top:12px">${canSpeak?`<button class="btn" id="all">🔊 Écouter tout le dialogue</button>`:""}<button class="btn ghost" id="tr">${showTr?"Masquer":"Afficher"} la traduction</button></div>
    <div class="bubbles">${D.lines.map((l,i)=>`<div class="bubble ${l[0]==="Snoop"?"me":""}"><div class="who"><span>${esc(l[0])}</span>${canSpeak?`<button class="mini" data-l="${i}" aria-label="Écouter cette réplique">🔊</button>`:""}</div><div class="es">${esc(l[1])}</div>${showTr?`<div class="tr">${esc(l[2])}</div>`:""}</div>`).join("")}</div>
    <button class="btn sun-btn" id="qz">Répondre aux 3 questions</button>`;
    $("bk").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}view=null;render()};
    $("tr").onclick=()=>{showTr=!showTr;const y=window.scrollY;render();window.scrollTo({top:y})};
    const all=$("all");if(all)all.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}D.lines.forEach(l=>speak(l[1],true))};
    document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>speak(D.lines[+b.dataset.l][1]));
    $("qz").onclick=()=>{let i=0,sc=0;const step=()=>{if(i>=D.q.length){S.dialogues[D.id]=Math.max(sc,S.dialogues[D.id]||0);markDay();save();
        app.innerHTML=`<div class="stage"><div class="card done-box"><div class="big">${sc} / 3</div><p>${sc===3?"¡Lo has entendido todo! Tu as tout compris.":"Réécoute le dialogue avec la traduction, puis réessaie."}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="re">Revoir le dialogue</button><button class="btn" id="bk2">Tous les dialogues</button></div></div></div>`;
        $("re").onclick=()=>render();$("bk2").onclick=()=>{view=null;render()};return}
      const[q,o,a]=D.q[i];
      quizItem([q,o,a,""],`<button class="back" id="quit">← Dialogue</button><div class="progress"><span>${esc(D.t)}</span><span>${i+1} / 3</span></div>`,ok=>{if(ok)sc++;i++;step()},{shuffle:true});
      $("quit").onclick=()=>render()};step()};
  };
  render();
}

function renderLevel(){
  const P=S.placement;const L=myLevel();
  const ladder=[1,2,3].map(l=>{const sc=P?P.scores[l]:null;return `<div class="${S.level===l?"here":""} ${sc!==null&&sc>=6?"ok":""}"><b>${LVL[l]}</b>${LVLNAME[l]}${sc!==null?`<br>${sc}/8`:""}</div>`}).join("");
  const skills=P?Object.entries(P.skills).map(([k,v])=>`<div class="skill"><span>${k}</span><div class="track"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></div><b>${v.ok}/${v.n}</b></div>`).join(""):"";
  const learnedBy=l=>{const cs=allCards.filter(c=>c.lvl===l);return `${cs.filter(c=>S.cards[c.id]&&S.cards[c.id].reps>=2).length}/${cs.length}`};
  const advice={1:"On consolide les bases : salutations, nombres, articles, présent et ser/estar. Les séances piochent surtout dans le niveau A1.",
                2:"Les bases sont là. On travaille le passé composé, gustar, les verbes irréguliers et le vocabulaire du voyage et des courses.",
                3:"Bon niveau ! On s'attaque aux temps du passé (indefinido, imparfait), à por/para et aux expressions pour raconter."}[L];
  app.innerHTML=`<h2>Mon niveau</h2><p class="lead">${P?`Test passé le ${new Date(P.date+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}. C'est une estimation indicative, pas un diplôme : elle sert à choisir les bons exercices.`:"Le test de niveau dure environ 5 minutes. Il sert à adapter les séances à ce que tu sais déjà."}</p>
   <div class="two">
    <section class="panel">
      ${P?`<div class="eyebrow">Résultat estimé</div><div class="result-level">${P.label}</div><p class="hint" style="margin:6px 0 0">${P.total} bonnes réponses sur ${PLACEMENT.length}</p>
      <div class="ladder">${ladder}</div><div class="skills">${skills}</div>
      <div class="note">${advice}</div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="retest">Refaire le test</button></div>`
      :`<div class="eyebrow">Pas encore testé</div><h3 style="font-family:var(--f-display);font-weight:400;font-size:1.6rem">Où en es-tu ?</h3><p>24 questions, du plus simple au plus avancé. Si tu ne sais pas, clique sur « Je ne sais pas » plutôt que de deviner : le résultat sera plus juste.</p><button class="btn sun-btn" id="retest">Commencer le test</button>`}
      <div style="margin-top:22px"><span class="hint">Ou choisir le niveau de travail toi-même :</span>
      <div class="filter" style="margin-top:8px">${[1,2,3].map(l=>`<button aria-pressed="${S.level===l}" data-l="${l}">${LVL[l]} · ${LVLNAME[l]}</button>`).join("")}</div></div>
    </section>
    <section class="panel">
      <div class="eyebrow">Ma progression</div>
      <div class="stats" style="margin:12px 0 18px">
        ${[1,2,3].map(l=>`<div class="stat"><b>${learnedBy(l)}</b><span>mots ${LVL[l]} retenus</span></div>`).join("")}
        <div class="stat"><b>${Object.keys(S.dialogues).length}/${DIALOGUES.length}</b><span>dialogues compris</span></div>
      </div>
      <h3>Sauvegarder ma progression</h3>
      <p class="hint" style="margin:0 0 10px">La progression reste dans ce navigateur. Pour la garder en sécurité ou la passer sur un autre ordinateur, copie ce code et garde-le (dans un mail à toi-même par exemple).</p>
      <textarea id="code" readonly></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="copy">Copier le code</button></div><div class="msg" id="copyMsg"></div>
      <h3 style="margin-top:20px">Restaurer une sauvegarde</h3>
      <textarea id="imp" placeholder="Colle ici un code de sauvegarde"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="restore">Restaurer</button></div><div class="msg" id="impMsg"></div>
    </section>
   </div>`;
  $("retest").onclick=startPlacement;
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.level=+b.dataset.l;S.session=null;save();render()});
  const exp={...S,session:null};
  let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(exp))))}catch(e){}
  $("code").value=code;
  $("copy").onclick=()=>{const t=$("code");const ok=()=>{$("copyMsg").className="msg ok";$("copyMsg").textContent="Code copié."};
    const fb=()=>{t.focus();t.select();try{document.execCommand("copy");ok()}catch(e){$("copyMsg").className="msg";$("copyMsg").textContent="Le code est sélectionné : fais Ctrl+C pour le copier."}};
    try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(e){fb()}};
  let armed=false;
  $("restore").onclick=()=>{const m=$("impMsg");let data;
    try{data=JSON.parse(decodeURIComponent(escape(atob($("imp").value.trim()))));if(!data||typeof data!=="object"||!data.cards)throw 0}catch(e){m.className="msg ko";m.textContent="Ce code n'est pas reconnu. Vérifie qu'il a été copié en entier.";return}
    if(!armed){armed=true;m.className="msg";m.textContent="La progression actuelle sera remplacée. Clique encore sur « Restaurer » pour confirmer.";$("restore").textContent="Confirmer la restauration";return}
    S=Object.assign(blank(),data);S.session=null;save();m.className="msg ok";m.textContent="Progression restaurée.";setTimeout(render,700)};
}

render();

</script>
</body>
</html>
